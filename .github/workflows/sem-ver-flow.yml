name: Semantic Version Flow

on:
  push:
    branches:
      - develop
    paths:
      - 'menu-configs/**/*.json'

jobs:
  semantic-version-flow:
    name: Auto-update version and lastUpdate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine version
        id: bump_version
        run: node scripts/set-semantic-version.js

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add menu-configs/*.json

          BUMP_TYPE="${{ steps.bump_version.outputs.bump_type }}"

          git commit -m "chore: auto-update metadata ($BUMP_TYPE) [skip ci]

          - Version bump: $BUMP_TYPE
          - Updated lastUpdate timestamps

          Auto-generated by update-metadata workflow"

          git push
